<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meus Vídeos</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#12141c; --bg2:#1b1e29; --card:#20232f;
    --text:#f3f1ea; --muted:#9a9db0;
    --accent:#e8a33d; --accent-dim:#8a6224;
    --focus: 0 0 0 4px var(--accent), 0 0 24px rgba(232,163,61,.5);
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    overflow-x:hidden;
  }
  .hide{display:none !important}

  /* ---------- Cabeçalho ---------- */
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:28px 48px 8px;
  }
  header h1{
    font-size:28px; margin:0; font-weight:700; letter-spacing:.2px;
  }
  header h1 span{color:var(--accent)}
  #btnConfig{
    background:var(--bg2); color:var(--muted); border:2px solid transparent;
    border-radius:10px; padding:10px 16px; font-size:15px; cursor:pointer;
  }
  #btnConfig:focus{outline:none; box-shadow:var(--focus); color:var(--text); border-color:var(--accent)}

  /* ---------- Grade ---------- */
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
    gap:28px; padding:24px 48px 60px;
  }
  .card{
    background:var(--card); border-radius:14px; overflow:hidden;
    border:2px solid transparent; cursor:pointer;
    transform:scale(1); transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:focus{outline:none; box-shadow:var(--focus); border-color:var(--accent); transform:scale(1.045)}
  .thumb{
    width:100%; aspect-ratio:16/9; background:#0d0e13 center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
  }
  .thumb .ph{color:#454a5c; font-size:13px}
  .badge{
    position:relative; top:-32px; left:10px; display:inline-block;
    background:rgba(0,0,0,.55); color:var(--accent); font-size:11px;
    padding:3px 8px; border-radius:6px; font-weight:600;
  }
  .cardTitle{
    padding:12px 14px 16px; margin-top:-18px; font-size:16px; font-weight:600;
    line-height:1.3;
  }

  /* ---------- Estados vazios ---------- */
  .msg{
    padding:80px 48px; text-align:center; color:var(--muted); font-size:17px;
  }
  .msg button{
    margin-top:18px; background:var(--accent); color:#1b1409; border:none;
    padding:12px 22px; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .msg button:focus{outline:none; box-shadow:var(--focus)}

  /* ---------- Tela de configuração ---------- */
  #config{
    position:fixed; inset:0; background:var(--bg); z-index:20;
    display:flex; align-items:center; justify-content:center; padding:40px;
  }
  .configBox{max-width:560px; width:100%}
  .configBox h2{font-size:24px; margin:0 0 6px}
  .configBox p{color:var(--muted); font-size:15px; line-height:1.5}
  .configBox input{
    width:100%; padding:14px 16px; font-size:16px; border-radius:10px;
    border:2px solid var(--bg2); background:var(--bg2); color:var(--text);
    margin:18px 0 16px;
  }
  .configBox input:focus{outline:none; box-shadow:var(--focus); border-color:var(--accent)}
  .configBox button{
    background:var(--accent); color:#1b1409; border:none; padding:14px 22px;
    font-size:16px; font-weight:700; border-radius:10px; cursor:pointer; margin-right:10px;
  }
  .configBox button:focus{outline:none; box-shadow:var(--focus)}
  .configBox .secundario{background:transparent; color:var(--muted); border:2px solid var(--bg2)}

  /* ---------- Player ---------- */
  #player{
    position:fixed; inset:0; background:#000; z-index:30;
    display:flex; align-items:center; justify-content:center;
  }
  #player iframe, #player video{width:100%; height:100%; border:0}
  #playerBar{
    position:fixed; top:0; left:0; right:0; padding:16px 24px;
    background:linear-gradient(rgba(0,0,0,.75), transparent);
    display:flex; align-items:center; gap:14px; z-index:31;
    padding-top: calc(16px + env(safe-area-inset-top,0px));
  }
  #btnVoltar{
    background:rgba(255,255,255,.12); color:var(--text); border:2px solid transparent;
    border-radius:8px; padding:8px 14px; font-size:15px; cursor:pointer;
  }
  #btnVoltar:focus{outline:none; box-shadow:var(--focus); border-color:var(--accent)}
  #playerTitle{font-size:16px; color:var(--muted)}
  .voltarCard{display:flex;align-items:center;justify-content:center;min-height:120px;padding:16px;color:var(--accent);font-weight:700;font-size:18px;text-align:center}
  .aviso{grid-column:1/-1;color:var(--muted);font-size:15px;padding:0 4px}
</style>
</head>
<body>

<header>
  <h1>Meus <span>Vídeos</span></h1>
  <button id="btnConfig" tabindex="0">Configurar lista</button>
</header>

<div id="grid"></div>

<!-- Tela inicial de configuração (primeira vez) -->
<div id="config" class="hide">
  <div class="configBox">
    <h2>Bem-vindo</h2>
    <p>Cole abaixo o link do arquivo JSON com a sua lista de vídeos. Você pode
       trocar esse link depois a qualquer momento pelo botão "Configurar lista".</p>
    <input id="inputUrl" type="text" placeholder="https://.../videos.json" tabindex="0">
    <div>
      <button id="btnSalvar" tabindex="0">Salvar</button>
      <button id="btnCancelar" class="secundario hide" tabindex="0">Cancelar</button>
    </div>
  </div>
</div>

<!-- Player -->
<div id="player" class="hide">
  <div id="playerBar">
    <button id="btnVoltar" tabindex="0">‹ Voltar</button>
    <span id="playerTitle"></span>
  </div>
  <div id="playerArea"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.8/dist/hls.min.js"></script>
<script>
(function(){
  var grid = document.getElementById('grid');
  var configScreen = document.getElementById('config');
  var inputUrl = document.getElementById('inputUrl');
  var btnSalvar = document.getElementById('btnSalvar');
  var btnCancelar = document.getElementById('btnCancelar');
  var btnConfig = document.getElementById('btnConfig');
  var playerScreen = document.getElementById('player');
  var playerArea = document.getElementById('playerArea');
  var playerTitle = document.getElementById('playerTitle');
  var btnVoltar = document.getElementById('btnVoltar');

  var STORAGE_KEY = 'meusvideos_config_url';
  var MAX_CANAIS = 300;
  var focusables = [];
  var cols = 1;
  var listaPrincipal = [];
  var emCanais = false;
  var hlsAtual = null;
  var ultimoFoco = null;
  var tituloAtual = '';

  function getConfigUrl(){
    try { return localStorage.getItem(STORAGE_KEY) || ''; } catch(e){ return ''; }
  }
  function setConfigUrl(url){
    try { localStorage.setItem(STORAGE_KEY, url); } catch(e){}
  }

  function showConfig(comCancelar){
    inputUrl.value = getConfigUrl();
    btnCancelar.classList.toggle('hide', !comCancelar);
    configScreen.classList.remove('hide');
    setTimeout(function(){ inputUrl.focus(); }, 50);
  }
  function hideConfig(){ configScreen.classList.add('hide'); }

  btnConfig.addEventListener('click', function(){ showConfig(true); });
  btnCancelar.addEventListener('click', hideConfig);
  btnSalvar.addEventListener('click', function(){
    var v = inputUrl.value.trim();
    if(!v) return;
    setConfigUrl(v);
    hideConfig();
    carregarVideos();
  });

  function msgVazio(texto, botaoTexto, aoClicar){
    grid.innerHTML = '';
    var div = document.createElement('div');
    div.className = 'msg';
    div.innerHTML = '<div>'+texto+'</div>';
    if(botaoTexto){
      var b = document.createElement('button');
      b.textContent = botaoTexto;
      b.setAttribute('tabindex','0');
      b.addEventListener('click', aoClicar);
      div.appendChild(b);
      focusables = [b];
      b.focus();
    } else {
      focusables = [];
    }
    grid.appendChild(div);
  }

  function extrairIdYoutube(url){
    var m = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11})(?:[&?].*)?$/) || url.match(/youtu\.be\/([0-9A-Za-z_-]{11})/);
    return m ? m[1] : url;
  }

  // ---------- Grade ----------
  function renderGrid(videos, modoCanais, total){
    grid.innerHTML = '';
    focusables = [];

    var obs = null;
    if('IntersectionObserver' in window){
      obs = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          if(en.isIntersecting){
            var el = en.target;
            if(el.getAttribute('data-bg')){
              el.style.backgroundImage = 'url("'+el.getAttribute('data-bg')+'")';
              el.removeAttribute('data-bg');
            }
            obs.unobserve(el);
          }
        });
      }, {rootMargin:'400px'});
    }

    if(modoCanais){
      var back = document.createElement('div');
      back.className = 'card voltarCard';
      back.setAttribute('tabindex','0');
      back.setAttribute('role','button');
      back.textContent = '‹ Voltar para minha lista';
      back.addEventListener('click', voltarCanais);
      back.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); voltarCanais(); }
      });
      grid.appendChild(back);
      focusables.push(back);
      if(total && total > videos.length){
        var aviso = document.createElement('div');
        aviso.className = 'aviso';
        aviso.textContent = 'Mostrando os primeiros '+videos.length+' de '+total+' canais.';
        grid.appendChild(aviso);
      }
    }

    videos.forEach(function(v){
      var card = document.createElement('div');
      card.className = 'card';
      card.setAttribute('tabindex','0');
      card.setAttribute('role','button');

      var thumb = document.createElement('div');
      thumb.className = 'thumb';
      if(v.thumbnail){
        var bg = v.thumbnail.replace(/"/g,'%22');
        if(obs){ thumb.setAttribute('data-bg', bg); obs.observe(thumb); }
        else { thumb.style.backgroundImage = 'url("'+bg+'")'; }
      } else {
        thumb.innerHTML = '<span class="ph">sem capa</span>';
      }
      card.appendChild(thumb);

      var badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = (v.type === 'youtube') ? 'YouTube' : (ehLista(v) ? 'Lista' : 'Vídeo');
      card.appendChild(badge);

      var title = document.createElement('div');
      title.className = 'cardTitle';
      title.textContent = v.title || 'Sem título';
      card.appendChild(title);

      card.addEventListener('click', function(){ abrirItem(v); });
      card.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrirItem(v); }
      });

      grid.appendChild(card);
      focusables.push(card);
    });

    setTimeout(function(){
      if(focusables.length < 2){ cols = 1; }
      else {
        var topoFirst = focusables[0].offsetTop;
        cols = 1;
        for(var i=1;i<focusables.length;i++){
          if(focusables[i].offsetTop !== topoFirst){ cols = i; break; }
        }
      }
      var alvoFoco = modoCanais && focusables.length > 1 ? focusables[1] : focusables[0];
      if(alvoFoco) alvoFoco.focus();
    }, 30);
  }

  document.addEventListener('keydown', function(e){
    if(!configScreen.classList.contains('hide')) return;
    var isBack = (e.key === 'Escape' || e.key === 'Backspace' || e.key === 'GoBack');
    if(!playerScreen.classList.contains('hide')){
      if(isBack){ e.preventDefault(); fecharPlayer(); }
      return;
    }
    if(isBack && emCanais){ e.preventDefault(); voltarCanais(); return; }
    var idx = focusables.indexOf(document.activeElement);
    if(idx === -1) return;
    var alvo = -1;
    if(e.key === 'ArrowRight') alvo = idx+1;
    else if(e.key === 'ArrowLeft') alvo = idx-1;
    else if(e.key === 'ArrowDown') alvo = idx+cols;
    else if(e.key === 'ArrowUp') alvo = idx-cols;
    if(alvo >= 0 && alvo < focusables.length){
      e.preventDefault();
      focusables[alvo].focus();
    }
  });

  // ---------- Listas M3U ----------
  function ehLista(v){
    return v.type === 'm3u' || /\.m3u(\?|#|$)/i.test(v.url || '');
  }

  function parseM3U(texto){
    var linhas = texto.split(/\r?\n/), lista = [], atual = null;
    linhas.forEach(function(l){
      l = l.trim();
      if(!l) return;
      if(l.indexOf('#EXTINF') === 0){
        var nome = l.split(',').slice(1).join(',').trim();
        var logo = (l.match(/tvg-logo="([^"]*)"/) || [])[1] || '';
        atual = { title: nome || 'Canal', thumbnail: logo, type: 'direct' };
      } else if(l.charAt(0) !== '#'){
        if(atual){ atual.url = l; lista.push(atual); atual = null; }
        else { lista.push({ title: l.split('/').pop() || 'Vídeo', thumbnail: '', url: l, type: 'direct' }); }
      }
    });
    return lista;
  }

  function abrirItem(v){
    ultimoFoco = document.activeElement;
    if(ehLista(v)) abrirLista(v); else abrirPlayer(v);
  }

  function abrirLista(v){
    msgVazio('Carregando canais…', null);
    fetch(v.url, {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.text(); })
      .then(function(texto){
        if(texto.indexOf('#EXT-X-') !== -1){
          // é um stream HLS (.m3u8), não uma lista de canais
          renderGrid(listaPrincipal);
          abrirPlayer({title: v.title, url: v.url, type: 'direct'});
          return;
        }
        var canais = parseM3U(texto);
        if(!canais.length) throw new Error('vazia');
        emCanais = true;
        try { history.pushState({c:1}, ''); } catch(e){}
        renderGrid(canais.slice(0, MAX_CANAIS), true, canais.length);
      })
      .catch(function(){
        emCanais = false;
        msgVazio('Não foi possível abrir essa lista. O link pode estar errado ou o servidor não permite o acesso.', 'Voltar', function(){ renderGrid(listaPrincipal); });
      });
  }

  function sairCanais(){
    emCanais = false;
    renderGrid(listaPrincipal);
  }
  function voltarCanais(){
    if(history.state && history.state.c){ history.back(); } else { sairCanais(); }
  }

  // ---------- Player ----------
  function montarEmbedYoutube(url){
    var listId = null, videoId = null;
    try {
      var u = new URL(url);
      listId = u.searchParams.get('list');
      videoId = u.searchParams.get('v');
      if(!videoId && /youtu\.be$/.test(u.hostname)){
        videoId = u.pathname.replace('/', '');
      }
    } catch(e){}
    if(videoId){
      return 'https://www.youtube.com/embed/'+videoId+(listId ? ('?list='+listId+'&autoplay=1&fs=1&rel=0') : '?autoplay=1&fs=1&rel=0');
    }
    if(listId){
      return 'https://www.youtube.com/embed/videoseries?list='+listId+'&autoplay=1&fs=1&rel=0';
    }
    return 'https://www.youtube.com/embed/'+extrairIdYoutube(url)+'?autoplay=1&fs=1&rel=0';
  }

  function tocarDireto(url){
    var video = document.createElement('video');
    video.controls = true;
    video.autoplay = true;
    video.setAttribute('playsinline','');
    playerArea.appendChild(video);

    var usouHls = false;
    function usarHls(){
      if(window.Hls && Hls.isSupported()){
        usouHls = true;
        hlsAtual = new Hls();
        hlsAtual.on(Hls.Events.ERROR, function(ev, data){ if(data && data.fatal) falhou(); });
        hlsAtual.loadSource(url);
        hlsAtual.attachMedia(video);
        return true;
      }
      return false;
    }
    function falhou(){
      var dica = /^http:/i.test(url) ? ' (links http:// podem ser bloqueados)' : '';
      playerTitle.textContent = tituloAtual + ' — não foi possível reproduzir este link' + dica;
    }

    if(/\.m3u8(\?|#|$)/i.test(url)){
      if(!usarHls()) video.src = url;
    } else {
      video.src = url;
    }
    video.addEventListener('error', function(){
      if(!usouHls && usarHls()) return;
      falhou();
    });
  }

  function abrirPlayer(v){
    tituloAtual = v.title || '';
    playerTitle.textContent = tituloAtual;
    playerArea.innerHTML = '';
    if(v.type === 'youtube'){
      var iframe = document.createElement('iframe');
      iframe.src = montarEmbedYoutube(v.url);
      iframe.setAttribute('allow','autoplay; encrypted-media; fullscreen');
      iframe.setAttribute('allowfullscreen','');
      playerArea.appendChild(iframe);
    } else {
      tocarDireto(v.url);
    }
    try { history.pushState({p:1}, ''); } catch(e){}
    playerScreen.classList.remove('hide');
    setTimeout(function(){ btnVoltar.focus(); }, 50);
  }

  function fecharPlayerReal(){
    if(hlsAtual){ try { hlsAtual.destroy(); } catch(e){} hlsAtual = null; }
    playerArea.innerHTML = '';
    playerScreen.classList.add('hide');
    if(ultimoFoco && document.body.contains(ultimoFoco)){ ultimoFoco.focus(); }
    else if(focusables.length){ focusables[0].focus(); }
  }
  function fecharPlayer(){
    if(history.state && history.state.p){ history.back(); } else { fecharPlayerReal(); }
  }
  btnVoltar.addEventListener('click', fecharPlayer);

  window.addEventListener('popstate', function(){
    if(!playerScreen.classList.contains('hide')){ fecharPlayerReal(); return; }
    if(emCanais){ sairCanais(); }
  });

  // ---------- Carregar lista principal ----------
  function carregarVideos(){
    var url = getConfigUrl();
    if(!url){ showConfig(false); return; }
    emCanais = false;
    msgVazio('Carregando sua lista de vídeos…', null);
    fetch(url, {cache:'no-store'})
      .then(function(r){ if(!r.ok) throw new Error('http '+r.status); return r.json(); })
      .then(function(data){
        if(!Array.isArray(data) || data.length === 0){
          msgVazio('Sua lista está vazia. Adicione vídeos no arquivo JSON.', 'Trocar link da lista', function(){ showConfig(true); });
          return;
        }
        listaPrincipal = data;
        renderGrid(data);
      })
      .catch(function(){
        msgVazio('Não foi possível carregar a lista. Verifique sua internet ou o link configurado.', 'Trocar link da lista', function(){ showConfig(true); });
      });
  }

  carregarVideos();
})();
</script>
</body>
</html>
